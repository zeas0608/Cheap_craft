name: Visual smoke test
on:
  push:
    paths:
      - index.html
      - tests/visual-smoke.cjs
      - .github/workflows/visual-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/visual-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-screenshots
          path: qa-screens
          if-no-files-found: ignore
